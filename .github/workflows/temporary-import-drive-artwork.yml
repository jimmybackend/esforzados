name: Temporary import of ArcadeCloud Drive artwork
# Temporary one-off workflow; remove after image is committed.
on:
  push:
    branches:
      - feat/drive-carousel-original-second
    paths:
      - .github/workflows/temporary-import-drive-artwork.yml
permissions:
  contents: write
jobs:
  import-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve unchanged source image from public ArcadeCloud repository
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/jimmybackend/s3/main/drive/images/home/carousel-01-s3-aws.png \
            -o assets/carousel-drive-aws.png
          printf 'Source Git blob: '
          git hash-object assets/carousel-drive-aws.png
          test "$(git hash-object assets/carousel-drive-aws.png)" = 'dd7395d4e030ead572a56c4f498a8ecd94ca02b0'
          file assets/carousel-drive-aws.png
      - name: Commit verified original artwork to feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/carousel-drive-aws.png
          git commit -m 'assets: incorporar original carousel-01-s3-aws.png de ArcadeCloud'
          git push origin HEAD:feat/drive-carousel-original-second
