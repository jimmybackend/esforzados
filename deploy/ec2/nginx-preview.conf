# Managed-by: esforzados-preview-setup
# Sitio estático independiente. No sustituye esforzados.com ni drive.esforzados.com.
# HTTPS: cuando el DNS de preview.esforzados.com apunte al servidor,
# ejecutar: sudo certbot --nginx -d preview.esforzados.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name preview.esforzados.com;

    root /var/www/esforzados/current;
    index index.html;
    autoindex off;

    access_log /var/log/nginx/esforzados-preview.access.log;
    error_log /var/log/nginx/esforzados-preview.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # No permitir archivos ocultos, PHP u otros scripts en esta portada.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.php(?:$|/) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
